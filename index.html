<!DOCTYPE html>
<html>
<head>
    <title>Flexbox Example</title>

    <style>
        
        .container {
            display: flex;
            height: 250px;
            background-color: rgb(235, 21, 21);
            align-items: flex-start;
            gap: 10px;
            padding: 10px;
        }

        #box1 {
            background-color: blue;
            color: white;
            padding: 20px;
            height: 100px;
        }
        .box {
            width: 100px;
            height: 80px;
            background-color: rgb(4, 51, 70);
            border: 2px solid black;
            text-align: center;
            padding-top: 10px;
            box-sizing: border-box;
        }

    
        .box1 {
            order: 3;
        }

        .box2 {
            order: 1;
        }
        .box3 {
            order: 3;
        }

        .box4 {
            order: 4;
        }

        .box5 {
            order: 5;
        }

        .box6 {
            order: 6;
        }
        .box7 {
            order: 7;
        }

        .box8 {
            order: 8
        }

        .box9 {
            order: 9
        }

        

        .box4 {

        }
    </style>
</head>

<body>

    <h2>Main container</h2>

    <div class="container">
        <div class="box box1">Box 1</div>
        <div class="box box2">Box 2</div>
        <div class="box box3">Box 3</div>
        <div class="box box5">Box 4</div>
        <div class="box box6">Box 5</div>
        <div class="box box7">Box 6</div>
        <div class="box box8">Box 6</div>
        <div class="box box9">Box 6</div>
    
    </div>

</body>
</html>
